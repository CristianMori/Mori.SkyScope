name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Windows so the WPF projects build; everything else is cross-platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run pack

      - run: dotnet build dotnet/Mori.SkyScope.slnx -c Release
      - run: dotnet test dotnet/Mori.SkyScope.Core.Tests -c Release --no-build
      - run: dotnet pack dotnet/Mori.SkyScope.slnx -c Release --no-build -o artifacts/nuget

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/npm/*.tgz
            artifacts/nuget/*.nupkg
